<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Verify Your Velte Account</title>
  </head>
  <body style="font-family: Arial, sans-serif; background-color: #f7f9fc; padding: 20px;">
    <table align="center" width="100%" style="max-width: 600px; background: #fff; border-radius: 8px; overflow: hidden;">
      <tr>
        <td style="background: rgba(247, 107, 16, 1); padding: 20px; text-align: center;">
          <h1 style="color: #fff; margin: 0;">Velte</h1>
        </td>
      </tr>
      <tr>
        <td style="padding: 30px;">
          <h2 style="color: #0f172a;">Verify Your Email Address</h2>
          <p style="font-size: 15px; color: #555;">
            Hi <strong>{{name}}</strong>,<br /><br />
            Welcome to Velte 🎉. Please verify your email by clicking the button below.
          </p>
          <div style="text-align: center; margin: 30px 0;">
            <a href="{{verificationLink}}" style="background: rgba(247, 107, 16, 1); color: #fff; padding: 14px 28px; border-radius: 6px; text-decoration: none;">Verify My Email</a>
          </div>
          <p style="font-size: 14px; color: #666;">
            If you didn’t create an account, please ignore this email.
          </p>
        </td>
      </tr>
      <tr>
        <td style="background: #f1f5f9; padding: 15px; text-align: center; font-size: 12px; color: #777;">
          © 2025 Velte Technologies Ltd, Enugu, Nigeria
        </td>
      </tr>
    </table>
  </body>
</html>
